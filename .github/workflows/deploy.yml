name: deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: github-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Ruby and locked dependencies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install image conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Set repository metadata
        run: echo "PAGES_REPO_NWO=${{ github.repository }}" >> "$GITHUB_ENV"

      - name: Configure deployment
        id: setup
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "SRC_BRANCH=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "NO_PUSH=--no-push" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish to the existing Pages branch
        env:
          SOURCE_BRANCH: ${{ steps.setup.outputs.SRC_BRANCH }}
        run: |
          printf 'y\n' | bash bin/deploy --verbose ${{ steps.setup.outputs.NO_PUSH }} --src "$SOURCE_BRANCH" --deploy gh-pages
