<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.nav_key == 'home' %}Zewei Zhang{% else %}{{ page.title | escape }} · Zewei Zhang{% endif %}</title>
<meta name="description" content="{{ page.description | escape }}">
<meta name="theme-color" content="#ffffff">
<meta property="og:title" content="{% if page.nav_key == 'home' %}Zewei Zhang{% else %}{{ page.title | escape }} · Zewei Zhang{% endif %}">
<meta property="og:description" content="{{ page.description | escape }}">
<meta property="og:image" content="{{ '/assets/img/research-teaser.jpg' | absolute_url }}">
<meta property="og:type" content="website">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" href="{{ '/assets/img/research-mark.svg' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;450;500;550;600;650;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/research-home.css' | relative_url }}">
{% if page.extra_css %}<link rel="stylesheet" href="{{ page.extra_css | relative_url }}">{% endif %}
<script src="{{ '/assets/js/research-home.js' | relative_url }}" defer></script>
